<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #202124;
      max-width: 860px;
      margin: 0 auto;
      padding: 20px;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    .card {
      border: 1px solid #dadce0;
      border-radius: 10px;
      padding: 16px;
      margin: 14px 0;
    }
    .fixed { background: #f8f9fa; }
    .warn {
      background: #fef7e0;
      border: 1px solid #f9ab00;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      line-height: 1.6;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      font-size: 14px;
    }
    input, select {
      padding: 9px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      margin: 6px 0 10px;
    }
    select { height: 300px; }
    button {
      padding: 11px 12px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 8px;
    }
    button:disabled { opacity: .55; cursor: default; }
    .primary { background: #1a73e8; color: #fff; }
    .danger { background: #d93025; color: #fff; }
    .secondary { background: #f1f3f4; color: #202124; }
    .muted { color: #5f6368; font-size: 12px; line-height: 1.5; }
    .status {
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 12px;
    }
    .preview { display: none; margin-top: 14px; }
    .previewText {
      white-space: pre-wrap;
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px;
      line-height: 1.6;
      font-size: 13px;
    }
    .two {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: end;
    }
    .two button {
      width: auto;
      min-width: 120px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>PROJECT SIXTH — Prediction Ops 上書き</h1>

  <div class="card fixed">
    <strong>固定コピー先</strong>
    <div class="muted">
      1ZGb__FQT25BPkzovq2UTfO4clvE7G71PiRm3yywSj6Y
    </div>
    <p>
      コピー先ファイルID/URLは維持し、中のWorkbookを正規15タブへ置換します。
      コピー元は読み取り専用です。
    </p>
  </div>

  <div class="warn">
    v2.1.0では安全性を維持したまま、数式復元・flush・重複検証をバッチ化しています。
    DriveのGoogle Sheetsを最大10件だけ自動読込します。URL / IDの直接入力も利用できます。
    バックアップは必須です。
  </div>

  <div class="card">
    <label><strong>コピー元URLまたはSpreadsheet ID</strong></label>
    <input id="manual" type="text"
      placeholder="https://docs.google.com/spreadsheets/d/... または Spreadsheet ID">

    <div class="two">
      <div>
        <label><strong>Google Sheets一覧（最大10件）</strong></label>
        <input id="filter" type="text"
          placeholder="ファイル名で絞り込み"
          oninput="filterFiles()">
      </div>
      <button class="secondary" onclick="loadFiles()">一覧を読込</button>
    </div>

    <select id="files" size="10"></select>

    <button id="previewButton" class="primary" onclick="previewSource()">
      コピー内容を確認
    </button>

    <div id="status" class="status"></div>

    <div id="preview" class="preview">
      <div id="previewText" class="previewText"></div>

      <button id="runButton" class="danger" onclick="runOverwrite()">
        バックアップ作成後、このコピー元で上書きを実行
      </button>

      <button class="secondary" onclick="resetPreview()">
        選び直す
      </button>
    </div>
  </div>

<script>
var allFiles = [];
var selectedSourceId = '';

function errText(error) {
  if (!error) return '不明なエラー';
  return error.message || String(error);
}

function setStatus(text) {
  document.getElementById('status').textContent = text || '';
}

function setBusy(busy) {
  document.getElementById('previewButton').disabled = busy;
  document.getElementById('runButton').disabled = busy;
}

function loadFiles() {
  setBusy(true);
  setStatus('Google DriveのGoogle Sheets一覧を読み込み中…');

  google.script.run
    .withSuccessHandler(function(files) {
      allFiles = files || [];
      renderFiles(allFiles);
      setBusy(false);
      setStatus(
        allFiles.length
          ? allFiles.length + '件を読み込みました。更新日時の新しい順です。'
          : '一覧を取得できませんでした。URL / IDを直接入力してください。'
      );
    })
    .withFailureHandler(function(error) {
      setBusy(false);
      setStatus('一覧取得エラー: ' + errText(error));
    })
    .listSourceSpreadsheets();
}

function renderFiles(files) {
  var select = document.getElementById('files');
  select.innerHTML = '';

  files.forEach(function(file) {
    var option = document.createElement('option');
    option.value = file.id;
    option.textContent = file.name + '  [' + file.updated + ']';
    select.appendChild(option);
  });
}

function filterFiles() {
  var q = document.getElementById('filter').value.toLowerCase();

  renderFiles(allFiles.filter(function(file) {
    return file.name.toLowerCase().indexOf(q) !== -1;
  }));
}

function getSourceInput() {
  var manual = document.getElementById('manual').value.trim();
  if (manual) return manual;

  var select = document.getElementById('files');
  return select.value || '';
}

function previewSource() {
  var input = getSourceInput();

  if (!input) {
    setStatus('コピー元URL / IDを入力するか、一覧から選択してください。');
    return;
  }

  setBusy(true);
  setStatus('コピー元contractを検証中…');
  document.getElementById('preview').style.display = 'none';

  google.script.run
    .withSuccessHandler(function(info) {
      selectedSourceId = info.sourceId;

      document.getElementById('previewText').textContent =
        'GAS implementation: ' + info.implementationVersion + '\n' +
        'コピー元: ' + info.sourceName + '\n' +
        'source timezone: ' + info.sourceTimeZone + '\n' +
        'contract: ' + info.contractId + ' / ' + info.schemaVersion + '\n' +
        'source tabs: ' + info.sheetCount + '\n\n' +
        '固定コピー先: ' + info.targetName + '\n' +
        '現在のtarget tabs: ' + info.targetCurrentSheets.length + '\n' +
        '現在のtarget timezone: ' + info.targetCurrentTimeZone + '\n' +
        '完了後timezone: ' + info.targetFinalTimeZone + '\n\n' +
        'sourceは正常です。';

      document.getElementById('preview').style.display = 'block';
      setBusy(false);
      setStatus('');
    })
    .withFailureHandler(function(error) {
      setBusy(false);
      setStatus('確認エラー: ' + errText(error));
    })
    .previewSource(input);
}

function runOverwrite() {
  if (!selectedSourceId) {
    setStatus('先に「コピー内容を確認」を実行してください。');
    return;
  }

  if (!confirm(
    '固定コピー先の現在の中身をバックアップした後、' +
    '正規15タブへ置換します。\n\n実行しますか？'
  )) {
    return;
  }

  setBusy(true);
  setStatus(
    '処理中です。\n' +
    'backup → stage 15 tabs → verify → promote → formulas → final verify → old削除'
  );

  google.script.run
    .withSuccessHandler(function(result) {
      setBusy(false);

      var seconds =
        typeof result.durationMs === 'number'
          ? (result.durationMs / 1000).toFixed(1)
          : '?';

      var text =
        '完了しました。\n' +
        'GAS: ' + result.implementationVersion + '\n' +
        'run: ' + result.runId + '\n' +
        'コピー元: ' + result.sourceName + '\n' +
        'コピー先timezone: ' + result.targetTimeZone + '\n' +
        '最終tab数: ' + result.sheetCount + '\n' +
        '処理時間: ' + seconds + '秒\n' +
        '完了時刻(JST): ' + result.completedAtJst + '\n' +
        'バックアップ: ' + result.backupUrl;

      if (result.auditWarning) {
        text += '\n警告: ' + result.auditWarning;
      }

      if (result.formulaWarnings && result.formulaWarnings.length) {
        text +=
          '\n数式正規化warning: ' +
          result.formulaWarnings.length +
          '件（参照整合性はPASS）';
      }

      setStatus(text);
      document.getElementById('preview').style.display = 'none';
      selectedSourceId = '';
    })
    .withFailureHandler(function(error) {
      setBusy(false);
      setStatus('実行エラー:\n' + errText(error));
    })
    .overwriteTargetFromSource(selectedSourceId);
}

function resetPreview() {
  selectedSourceId = '';
  document.getElementById('preview').style.display = 'none';
  setStatus('');
}

loadFiles();
</script>
</body>
</html>
